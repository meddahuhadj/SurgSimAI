version: '3.8'

# ==============================================================================
# docker-compose.yml — GeneralSurgPlan3D NextGen Enterprise Stack
# ==============================================================================
# Architecture complète et résiliente pour centre de cancérologie et hôpital universitaire.
# Inclut :
#   1. backend : API FastAPI hautement disponible (Jumeaux 3D, MONAI, Biomécanique, Dictée CCAM)
#   2. postgres : Base de données relationnelle sécurisée avec extension pgvector (Recherche sémantique & IA)
#   3. orthanc : Serveur PACS DICOMweb certifié pour l'imagerie médicale hospitalière

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: generalsurgplan3d-nextgen:2.4.0
    container_name: generalsurg_app
    restart: always
    environment:
      - DATABASE_URL=postgresql://surguser:SuperSecretSurgPwd2026@postgres:5432/generalsurg_db
      - ORTHANC_URL=http://orthanc:8042
      - MESH_STORAGE_DIR=/tmp/storage/meshes_v2
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_started
    volumes:
      - surg_storage:/tmp/storage
    networks:
      - hospital_secure_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: generalsurg_db
    restart: always
    environment:
      - POSTGRES_USER=surguser
      - POSTGRES_PASSWORD=SuperSecretSurgPwd2026
      - POSTGRES_DB=generalsurg_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surguser -d generalsurg_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital_secure_net

  orthanc:
    image: jodogne/orthanc-plugins:latest
    container_name: generalsurg_pacs
    restart: always
    ports:
      - "4242:4242"   # Port DICOM C-STORE standard hospitalier
      - "8042:8042"   # Interface HTTP / DICOMweb WADO-RS
    environment:
      - ORTHANC_NAME=GeneralSurgPlan3D_PACS
    volumes:
      - orthanc_storage:/var/lib/orthanc/db
    networks:
      - hospital_secure_net

volumes:
  pgdata:
    driver: local
  surg_storage:
    driver: local
  orthanc_storage:
    driver: local

networks:
  hospital_secure_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
