name: CI → Research Modules & Prototypes

on:
  push:
    branches: ["research/**", "feature/research-**", "research-ci"]
  pull_request:
    branches: ["main", "master"]
    paths:
      - 'backend/routers/chat.py'
      - 'backend/voice_llm_service.py'
      - 'backend/twin_solver.py'
  workflow_dispatch:

jobs:
  research-tests:
    name: Tests Prototypes & Recherche (RESEARCH_MODE=true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer les dépendances backend
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lancer la suite de tests en Mode Recherche (RESEARCH_MODE=true)
        env:
          APP_ENV: development
          SEED_DEMO_USERS: "true"
          JWT_SECRET: ci-test-secret-research-mode-only
          RESEARCH_MODE: "true"
        run: |
          python -m pytest tests/ -v -k "twin or chat or voice or prototype" --tb=short
