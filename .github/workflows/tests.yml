name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer les dépendances backend
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Vérification de la qualité de code (Ruff Linter)
        run: |
          pip install ruff
          ruff check backend/ tests/

      - name: Lancer la suite de tests Cliniques Certifiés (RESEARCH_MODE=false)
        env:
          APP_ENV: development
          SEED_DEMO_USERS: "true"
          JWT_SECRET: ci-test-secret-not-for-production-use
          RESEARCH_MODE: "false"
        run: |
          # pyproject.toml déclare testpaths = ["tests", "backend/tests"] — jusqu'ici
          # seul `tests/` tournait réellement en CI, laissant `backend/tests/` (119 tests
          # réels : clinical_scores, phi_filter, registration ICP/FFD, twin_solver,
          # mesh_distance...) totalement invisible d'un run CI, alors qu'ils passaient
          # déjà localement. Les deux dossiers tournent maintenant, alignés sur ce que
          # pyproject.toml déclarait déjà.
          python -m pytest tests/ backend/tests/ -v
